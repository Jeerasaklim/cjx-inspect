<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Site Nego Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#eeece3;--surface:#fff;--surface2:#f6f4ec;--ink:#1a1710;--muted:#6b6456;--faint:#9a9384;--border:#e4e0d3;--line:#efece2;--gold:#a97b00;--gold-soft:#fdf3cf;--purple:#7241b8;--purple-soft:#efe7fb;--boss:#0e7268;--boss-soft:#d5f0ec;--good:#0a8a5f;--good-soft:#dcf1e8;--bad:#cf4436;--bad-soft:#f8dfdc;--warn:#bd7912;--warn-soft:#f8ead0;--track:#e8e4d6;--y:#f5c400;--yd:#d4a900;--k:#17140c;--shadow:none;--accent:var(--gold);--accent-soft:var(--gold-soft)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141109;--surface:#1e1a12;--surface2:#262117;--ink:#f0ece0;--muted:#a89f8c;--faint:#6f6858;--border:#332d1f;--line:#2a2417;--gold:#e0ad4c;--gold-soft:#33280f;--purple:#b28bec;--purple-soft:#241634;--boss:#3fbdb0;--boss-soft:#0f3330;--good:#43c98d;--good-soft:#0f3327;--bad:#ee7365;--bad-soft:#3a1e1b;--warn:#e2a745;--warn-soft:#352914;--track:#2a2417;--y:#f5c400;--yd:#d4a900;--k:#17140c;--shadow:none}}
:root[data-theme=dark]{--bg:#141109;--surface:#1e1a12;--surface2:#262117;--ink:#f0ece0;--muted:#a89f8c;--faint:#6f6858;--border:#332d1f;--line:#2a2417;--gold:#e0ad4c;--gold-soft:#33280f;--purple:#b28bec;--purple-soft:#241634;--boss:#3fbdb0;--boss-soft:#0f3330;--good:#43c98d;--good-soft:#0f3327;--bad:#ee7365;--bad-soft:#3a1e1b;--warn:#e2a745;--warn-soft:#352914;--track:#2a2417;--y:#f5c400;--yd:#d4a900;--k:#17140c;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun",system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.tnum{font-variant-numeric:tabular-nums}h1,h2,h3{font-family:"IBM Plex Sans Thai",sans-serif;margin:0}
#app{display:flex;min-height:100vh;--accent:var(--gold);--accent-soft:var(--gold-soft)}#app[data-mode=survey]{--accent:var(--good);--accent-soft:var(--good-soft)}#app[data-mode=ratkit]{--accent:var(--purple);--accent-soft:var(--purple-soft)}#app[data-mode=boss]{--accent:var(--boss);--accent-soft:var(--boss-soft)}
.sidebar{width:176px;flex-shrink:0;background:var(--y);color:var(--k);display:flex;flex-direction:column;padding:16px 0 14px;position:sticky;top:0;height:100vh;z-index:40}
.sidebar .logo{width:32px;height:32px;border-radius:9px;background:var(--k);color:var(--y);display:grid;place-items:center;font-size:17px;flex-shrink:0}
.sbrand{display:flex;align-items:center;gap:9px;padding:0 16px 16px}
.sbrand .brand{font-family:"IBM Plex Sans Thai";font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.14}
.snav{display:flex;flex-direction:column;gap:3px;padding:0 10px}
.snav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--k);cursor:pointer;font-family:"IBM Plex Sans Thai";font-weight:700;font-size:14px;opacity:.74;white-space:nowrap}
.snav a .ni{font-size:17px}.snav a .nc{font-size:11px;opacity:.7;margin-left:auto;font-variant-numeric:tabular-nums}
.snav a:hover{opacity:1;background:rgba(0,0,0,.06)}
.snav a.on{background:var(--k);color:var(--y);opacity:1}.snav a.on .nc{color:var(--y);opacity:.85}
.sbottom{margin-top:auto;padding:0 10px}
.sbottom .sdiv{border-top:1px solid rgba(0,0,0,.14);margin:0 4px 8px}
.suser{display:flex;flex-direction:column;gap:5px;padding:11px 12px 0;margin-top:8px;border-top:1px solid rgba(0,0,0,.14);font-size:11px;color:var(--k);opacity:.78;font-weight:600}
.suser .upd b{font-weight:800}.suser .sw{cursor:pointer;text-decoration:underline;opacity:.8}
.hamb{display:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:19px;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0}
.sidescrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:39;display:none}.sidescrim.show{display:block}
.bell{position:relative;cursor:pointer;font-size:19px;line-height:1}
.bell .b{position:absolute;top:-6px;right:-8px;background:var(--bad);color:#fff;border-radius:20px;padding:0 5px;font-size:10px;font-weight:700;font-family:"IBM Plex Sans Thai";min-width:16px;text-align:center;box-sizing:content-box}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.pgtools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who-w select{background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-family:"IBM Plex Sans Thai";font-size:13px;font-weight:600}
.who-lbl{font-size:12px;color:var(--muted);font-weight:600}
.pgh{padding:22px 30px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pgh h1{font-size:21px;display:flex;align-items:center;gap:9px}
.pgh .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.seg{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:3px}
.seg button{border:none;background:transparent;color:var(--muted);font-family:"IBM Plex Sans Thai";font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:8px;cursor:pointer}.seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.content{padding:18px 30px 50px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.5}
.kpi.bad::after{background:var(--bad)}.kpi.warn::after{background:var(--warn)}.kpi.good::after{background:var(--good)}
.kpi .v{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:28px;line-height:1}.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}.kpi.good .v{color:var(--good)}
.kpi .l{font-size:12px;color:var(--muted);margin-top:7px}
.rail{display:flex;align-items:stretch;gap:0;margin-bottom:22px;overflow-x:auto;padding-bottom:2px}
.node{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px;cursor:pointer;box-shadow:var(--shadow);position:relative;transition:box-shadow .12s}
.node:hover{border-color:var(--yd)}
.node.on{outline:2px solid var(--accent);outline-offset:-1px}
.node.fin{background:var(--good-soft);border:2px solid var(--good)}
.node .nh{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ic nn""tt tt";align-items:center;column-gap:9px}.node .ni{grid-area:ic;width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.node.hot .ni{background:var(--bad-soft);color:var(--bad)}.node.fin .ni{background:var(--good);color:#fff}
.node .nt{grid-area:tt;font-family:"IBM Plex Sans Thai";font-weight:700;font-size:14px;margin-top:7px}.node .nn{grid-area:nn;justify-self:end;font-family:"IBM Plex Sans Thai";font-weight:800;font-size:23px}
.node .ntask{font-size:11px;color:var(--muted);margin:9px 0 10px;min-height:30px}
.node .nsla{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-weight:600;font-family:"IBM Plex Sans Thai";font-size:10.5px;color:var(--muted)}
.chip.red{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.railgap{display:flex;align-items:center;color:var(--faint);font-size:16px;padding:0 3px;flex-shrink:0}
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.tbar b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:3px 12px;font-family:"IBM Plex Sans Thai";font-weight:600;font-size:12px}
.qbox{flex:1;min-width:180px;max-width:320px;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font-family:"Sarabun";font-size:13px}
.fbox{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 11px;font-family:"IBM Plex Sans Thai";font-size:12.5px;font-weight:600;max-width:230px}
.clr{border:1px solid var(--border);background:var(--surface);color:var(--muted);border-radius:20px;padding:3px 11px;font-size:11.5px;cursor:pointer;font-family:"IBM Plex Sans Thai";font-weight:600}
.tblwrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:"IBM Plex Sans Thai";font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--faint);padding:11px 16px;background:var(--surface2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
th.r,td.r{text-align:right}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}tbody tr:hover{background:var(--surface2)}
.c1{display:flex;align-items:center;gap:10px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--good);flex-shrink:0}.sdot.red{background:var(--bad)}.sdot.amber{background:var(--warn)}.sdot.none{background:var(--faint)}.sdot.done{background:var(--good)}
.code{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:13px}
.nm2{font-size:11px;color:var(--faint)}
.who-c{display:flex;align-items:center;gap:8px}.av{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:"IBM Plex Sans Thai";font-weight:700;font-size:12px;flex-shrink:0}
.stepbadge{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;font-family:"IBM Plex Sans Thai";background:var(--surface2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.slacell{display:flex;flex-direction:column;gap:4px;min-width:130px}
.slatop{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.sla-red{color:var(--bad)}.sla-amber{color:var(--warn)}.sla-green{color:var(--good)}.sla-none{color:var(--faint)}.sla-done{color:var(--good)}
.slabar{height:5px;border-radius:3px;background:var(--track);overflow:hidden}.slabar>i{display:block;height:100%;border-radius:3px}
.gobtn{border:1px solid var(--border);background:var(--surface);color:var(--accent);font-family:"IBM Plex Sans Thai";font-weight:600;font-size:11.5px;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;display:inline-block}
td.act{white-space:nowrap;width:1%}
tbody tr:hover .gobtn{background:var(--accent);color:#fff;border-color:var(--accent)}
.hint{font-size:11.5px;color:var(--faint);font-style:italic;margin-top:14px}
.sh{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:16px;margin:6px 0 13px;display:flex;align-items:center;gap:8px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.bcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:17px;box-shadow:var(--shadow)}
.bcard .bt{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center}
.bcard .tot{font-size:12px;color:var(--muted);margin:4px 0 13px}
.bstat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.bstat .s{text-align:center;background:var(--surface2);border-radius:11px;padding:13px 4px}.bstat .v{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:24px}.bstat .l{font-size:10.5px;color:var(--muted);margin-top:3px}
.bstat .s.bad .v{color:var(--bad)}.bstat .s.good .v{color:var(--good)}.bstat .s.warn .v{color:var(--warn)}
.pgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.prow{display:flex;align-items:center;gap:11px;font-size:13px;padding:9px 0;border-top:1px solid var(--line)}.prow:first-of-type{border-top:none}.prow .pn{width:150px;font-weight:600;display:flex;align-items:center;gap:8px}.prow .tk{flex:1;height:14px;background:var(--track);border-radius:5px;overflow:hidden}.prow .tk>i{display:block;height:100%;border-radius:5px;background:var(--accent)}.prow .tk>i.red{background:var(--bad)}.prow .pf{width:110px;text-align:right;font-family:"IBM Plex Sans Thai";font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}.prow .pf small{color:var(--faint);font-weight:400}
.dqbar{position:relative;margin-bottom:14px}
.dqbar .qbox{width:100%}
#dqres{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20}
.dqlist{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.18);overflow:hidden;max-height:360px;overflow-y:auto}
.dqrow{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.dqrow:last-child{border-bottom:none}.dqrow:hover{background:var(--surface2)}
.dqi{font-size:16px}.dqx{flex:1}.dqc{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:13px}.dqs{font-size:11.5px;color:var(--muted)}
.dqgo{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:12px;color:var(--accent);white-space:nowrap}
.dqempty{padding:11px 14px;color:var(--faint);font-size:12.5px}
.ptseg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.ptseg button{flex:1;min-width:140px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:9px;font-family:"IBM Plex Sans Thai";font-weight:700;font-size:14px;color:var(--ink)}
.ptseg button .pi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:var(--surface2)}
.ptseg button.on{border-width:2px;border-color:var(--accent)}
.plensh{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:flex;align-items:center;gap:9px;margin:22px 0 11px}
.plensh .pdot{width:6px;height:16px;border-radius:3px;background:var(--accent)}
.plensh.u{color:var(--bad)}.plensh.u .pdot{background:var(--bad)}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.caltabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cft{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.cft .cfl{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:14px;color:var(--ink)}
.cft .cfn{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:12px;color:var(--muted)}
.cft.on{border-width:2px}
.cft-all.on{border-color:var(--k)}.cft-neg.on{border-color:var(--yd);background:var(--gold-soft)}.cft-o1.on{border-color:var(--purple);background:var(--purple-soft)}.cft-reg.on{border-color:var(--boss);background:var(--boss-soft)}
.cft.on .cfn{color:var(--ink)}
.calbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.calm2{font-family:"IBM Plex Sans Thai";font-weight:800;font-size:17px}
.calnav{display:flex;align-items:center;gap:8px;margin-left:auto}
.calnav button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 13px;font-size:13px;font-family:"IBM Plex Sans Thai";font-weight:600;cursor:pointer;color:var(--ink)}
.callegend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.callegend i.cd{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:5px}
.callegend .cmut{color:var(--faint)}
.cd.r{background:var(--bad)}.cd.a{background:var(--warn)}.cd.g{background:var(--good)}
.callayout{display:grid;grid-template-columns:1fr 330px;gap:16px;align-items:start}
.calcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.caldow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface2);border-bottom:1px solid var(--border)}
.caldow span{text-align:center;font-family:"IBM Plex Sans Thai";font-weight:700;font-size:11px;color:var(--faint);padding:8px 0}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.ccell{min-height:94px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 7px;cursor:pointer}
.ccell:nth-child(7n){border-right:none}
.ccell.pad{background:var(--surface2);cursor:default}
.ccell.has:hover{background:var(--surface2)}
.ccell .cdn{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:13px;color:var(--muted)}
.ccell.today{background:var(--gold-soft)}
.ccell.today .cdn{background:var(--k);color:var(--y);border-radius:7px;padding:1px 7px;display:inline-block}
.ccell.sel{outline:2px solid var(--yd);outline-offset:-2px}
.cev{margin-top:5px;display:flex;flex-direction:column;gap:3px}
.cchip{font-size:10px;border-radius:5px;padding:2px 6px;font-weight:600;font-family:"IBM Plex Sans Thai";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip.r{background:var(--bad-soft);color:var(--bad)}.cchip.a{background:var(--warn-soft);color:var(--warn)}.cchip.g{background:var(--good-soft);color:var(--good)}
.cmore{font-size:10px;color:var(--faint);font-weight:600;font-family:"IBM Plex Sans Thai"}
.calside{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;position:sticky;top:12px}
.csd{font-family:"IBM Plex Sans Thai";font-weight:800;font-size:17px}
.css2{font-size:12px;color:var(--muted);margin:2px 0 13px}
.csum{display:flex;gap:8px;margin-bottom:13px}
.csum .s{flex:1;text-align:center;border:1px solid var(--border);border-radius:10px;padding:8px 3px}
.csum .s .v{font-family:"IBM Plex Sans Thai";font-weight:800;font-size:19px}
.csum .s.r .v{color:var(--bad)}.csum .s.a .v{color:var(--warn)}.csum .s.g .v{color:var(--good)}
.csum .s .l{font-size:10px;color:var(--muted)}
.ctk{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.ctk:last-child{border-bottom:none}
.ctk .cbar{width:5px;border-radius:3px;flex-shrink:0}.ctk.r .cbar{background:var(--bad)}.ctk.a .cbar{background:var(--warn)}.ctk.g .cbar{background:var(--good)}
.ctk .ctt{font-family:"IBM Plex Sans Thai";font-weight:700;font-size:12.5px}
.ctk .ctm{font-size:11px;color:var(--muted);margin-top:1px}
.ctk .ctg{font-size:10px;font-family:"IBM Plex Sans Thai";font-weight:700;border-radius:20px;padding:1px 8px;margin-top:4px;display:inline-block}
.ctk.act{cursor:pointer;border-radius:9px;padding:9px 8px;margin:0 -8px;align-items:center}
.ctk.act:hover{background:var(--surface2)}
.ctk .cgo{align-self:center;font-family:"IBM Plex Sans Thai";font-weight:700;font-size:11px;color:var(--accent);white-space:nowrap;flex-shrink:0}
.ctk.r .ctg{background:var(--bad-soft);color:var(--bad)}.ctk.a .ctg{background:var(--warn-soft);color:var(--warn)}.ctk.g .ctg{background:var(--good-soft);color:var(--good)}
.calempty{color:var(--faint);font-style:italic;font-size:12.5px;padding:14px 0}
@media(max-width:860px){.callayout{grid-template-columns:1fr}.calside{position:static}.ccell{min-height:76px}.caltabs{grid-template-columns:repeat(2,1fr)}}
.pfun{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 17px;margin-top:12px}

var SEV={red:3,amber:2,green:1,none:0,done:0};
function siteAgg(){
 var TR=[["nego","🤝","เจรจา",DATA.nego],["survey","📐","รังวัด",DATA.survey],["o1","🏛️","อ.1",DATA.ratkit.o1],["reg","📋","ทะเบียน",DATA.ratkit.reg]];
 var u=curUser();var op=DATA._opened||{};var map={},order=[];
 TR.forEach(function(x){var bkt=x[3];if(!bkt)return;var fin=bkt.final;(bkt.tasks||[]).forEach(function(t){
   if(t.step===fin)return;                                   // จบท่อนนั้นแล้ว = ไม่ค้าง
   if(op[t.code])return;                                     // ร้านเปิดแล้ว = ไม่มีงานค้าง (หน้ารายสาขา)
   if(u&&u!=="__all__"&&t.owner!==u)return;                   // มุมมองรายคน (member)
   var m=map[t.code];if(!m){m={code:t.code,name:t.name,prov:t.prov,items:[]};map[t.code]=m;order.push(t.code);}
   if(!m.name&&t.name)m.name=t.name;if(!m.prov&&t.prov)m.prov=t.prov;
   m.items.push({trk:x[0],ico:x[1],tlabel:x[2],step:t.step,st:t.st,slatxt:t.slatxt,why:t.why,owner:t.owner,wlbl:(t.w&&t.w.lbl)||""});
 });});
 var arr=order.map(function(c){var m=map[c];var sev=0;m.items.forEach(function(it){var s=SEV[it.st]||0;if(s>sev)sev=s;});
   m.sev=sev;m.over=m.items.filter(function(it){return it.st==="red";}).length;return m;});
 arr.sort(function(a,b){return (b.sev-a.sev)||(b.over-a.over)||(b.items.length-a.items.length)||((a.code>b.code)?1:-1);});
 return arr;
}

 var b='<div class="kpis">'+kpiC(arr.length,"🏪 สาขาที่มีงานค้าง")+kpiC(overSites,"🔴 สาขามีงานเกิน SLA","bad")+kpiC(totItems,"📋 งานค้างรวม (ทุกท่อน)")+kpiC(overItems,"🔴 งานเกิน SLA รวม","bad")+'</div>';
 b+='<div class="tbar"><input id="q" class="qbox" placeholder="🔍 ค้นหา Site Code / ชื่อสาขา / จังหวัด..." value="'+esc(SEARCH)+'" oninput="SEARCH=this.value;siteFilter()"><span class="pill">🏪 <b id="cnt">0</b> สาขา</span><span style="margin-left:auto;color:var(--faint);font-size:12px">เรียง: งานด่วน/ค้างมากก่อน</span></div>';
 return b+'<div id="tblbox"></div>';
}

function psolo(name,cl,desc,stats){var b='<div class="psolo"><span class="pav '+cl+'">'+esc(name)+'</span><div style="flex:1"><div class="pn2">'+esc(name)+' — '+esc(desc)+'</div><div class="psp">';for(var i=0;i<stats.length;i++)b+='<div><div class="v '+(stats[i][2]||"")+'">'+stats[i][0]+'</div><div class="l">'+esc(stats[i][1])+'</div></div>';return b+'</div></div></div>';}

 ppl.slice(0,8).forEach(function(x,i){var rk=i<3?"g"+(i+1):"";var bc=x.pct<40?"lo":(x.pct<60?"mid":"");var hc=x.over>=10?"b":(x.over>0?"a":"z");
   b+='<tr onclick="drillPerson(\''+esc(x.nm)+'\')" style="cursor:pointer" title="คลิกดูงานของ '+esc(x.nm)+'"><td><span class="rk '+rk+'">'+(i+1)+'</span></td><td><span class="who">'+av(x.nm)+esc(x.nm)+'</span></td><td class="r tnum">'+x.hold+'</td><td><span class="pbar"><i class="'+bc+'" style="width:'+x.pct+'%"></i></span>'+x.pct+'%</td><td class="r"><span class="heat '+hc+'">'+x.over+'</span></td></tr>';});
 return b+'</tbody></table>';}
function perfNeg(p){var b=lensH("📊 มุมงาน");
 b+='<div class="kpis">'+kpiC(p.nego.total,"สัญญาทั้งหมด")+kpiC(p.nego.signed,"✅ เซ็นแล้ว ("+p.nego.close_pct+"%)","good")+kpiC(p.nego.pending,"📄 ค้าง","warn")+kpiC(p.nego.over,"🔴 เกิน 90 วัน","bad")+kpiC(p.nego.sla_pct+"%","✅ ตรง SLA","good")+'</div>';
 var mx=Math.max.apply(null,p.problems.map(function(x){return x[1];}).concat([p.nego.final]))||1;
 var topc=Math.max.apply(null,p.problems.map(function(x){return x[1];}))||0;
 b+='<div class="pfun">'+p.problems.map(function(x){var stp=x[0].replace(/^\S+\s/,"");return pfrow(x[0],x[1],Math.round(100*x[1]/mx),x[1]===topc&&topc>0?"hot":"","drillStep(\''+stp+'\')");}).join("")+pfrow("✅ เซ็นแล้ว (จบ)",p.nego.final,Math.round(100*p.nego.final/mx),"done")+'</div>';
 var top=p.problems.slice().sort(function(a,c){return c[1]-a[1];})[0];
 if(top)b+='<div class="pcall"><span style="font-size:22px">🔴</span><div><div class="cb">คอขวด: '+esc(top[0])+' '+top[1]+' ไซต์</div><div class="cs">โฟกัสตรงนี้ปลดล็อกสัญญาได้เยอะสุด</div></div></div>';
 b+=lensH("🧑 มุมรายคน — ใครแบก / ใครค้าง")+leadTable(p.persons_nego)+'<div class="note">แสดง '+Math.min(8,p.persons_nego.length)+' จาก '+p.persons_nego.length+' คน · เรียงตามงานในมือ</div>';
 b+=lensH("🚨 เร่งด่วน + เสี่ยงเปิดร้านเลื่อน",1);
 var ov=p.persons_nego.slice().filter(function(x){return x.over>0;}).sort(function(a,c){return c.over-a.over;}).slice(0,4);
 b+='<div class="prisk">'+ov.map(function(x){return rr(x.over>=10?"hi":"md",x.nm+" — เกิน SLA","ถือ "+x.hold+" · เซ็นได้ "+x.pct+"%","🔴 "+x.over,"drillPerson(\''+esc(x.nm)+'\')");}).join("")+'</div>';
 b+=pdelay("🏗️",p.nego.over+" ไซต์ยังไม่เซ็น + ค้างเกิน 90 วัน","ยังไม่เซ็น = เริ่มก่อสร้าง/ยื่น อ.1 ไม่ได้ → ค้างตั้งแต่ต้นน้ำ");
 return b;}
function perfO1(p){var o=DATA.ratkit.o1.tasks,S=DATA.ratkit.o1.steps;var b=lensH("📊 มุมงาน");
 b+='<div class="kpis k4">'+kpiC(p.ratkit.prep,"📑 ติดตามเอกสาร","pp")+kpiC(p.ratkit.wait,"🔎 ยื่น · ติดตาม อ.1","warn")+kpiC(p.ratkit.got,"✅ อ.1 ออกแล้ว","good")+kpiC(p.ratkit.waiver,"🏗️ อนุโลม","warn")+'</div>';
 var cnts=S.map(function(s){return pcnt(o,s.stp);});var mx=Math.max.apply(null,cnts)||1;
 b+='<div class="pfun">'+S.map(function(s,i){return pfrow(s.ico+" "+s.stp,cnts[i],Math.round(100*cnts[i]/mx),i===S.length-1?"done":(cnts[i]===mx&&mx>0?"hot":""),"drillO1Step(\''+s.stp+'\')");}).join("")+'</div>';
 b+=lensH("🧑 มุมรายคน — ทีมรัฐกิจ (คลิกดูงาน)");
 var ow={};o.forEach(function(t){var k=t.owner||"(ไม่ระบุ)";if(!ow[k])ow[k]={hold:0,got:0};ow[k].hold++;if(t.step===DATA.ratkit.o1.final)ow[k].got++;});
 var owl=Object.keys(ow).map(function(k){return [k,ow[k]];}).sort(function(a,c){return c[1].hold-a[1].hold;});
 var omax=owl.length?owl[0][1].hold:1;
 b+='<div class="hbwrap">'+owl.map(function(x){return '<div class="hb clk" onclick="drillTrack(\'o1\')"><span class="hk">'+av(x[0])+esc(x[0])+'</span><span class="ht"><i style="width:'+Math.round(100*x[1].hold/omax)+'%;background:var(--purple)"></i></span><span class="hv tnum">'+x[1].hold+'</span></div>';}).join("")+'</div>';
 b+=lensH("🚨 เร่งด่วน + เสี่ยงเปิดร้านเลื่อน",1);
 b+='<div class="prisk">'+rr("md","อนุโลม "+p.ratkit.waiver+" ไซต์ — ก่อสร้างก่อน ยังไม่ได้ใบจริง","ต้องตามใบ อ.1 ตัวจริงให้ออก","🏗️ "+p.ratkit.waiver,"drillTrack(\'o1\')")+rr("md","รอผลใบ อ.1 — "+p.ratkit.wait+" ไซต์","ตจว.45/กทม.60 วัน จากวันยื่น","🔎 "+p.ratkit.wait,"drillTrack(\'o1\')")+(p.ratkit.over>0?rr("hi","อ.1 เกิน SLA","เลยกำหนดจากวันยื่น","🔴 "+p.ratkit.over,"drillTrack(\'o1\')"):"")+'</div>';
 b+=pdelay("🎫","ไซต์ใกล้วันเปิดแต่ใบ อ.1 ยังไม่ออก","แอปจริงไฮไลต์เฉพาะ D-day ใกล้ + อ.1 ยังไม่ออก = ต้องเร่ง/อนุโลม");
 return b;}
function perfReg(p){var rg=DATA.ratkit.reg.tasks;var agg={},order=[];
 rg.forEach(function(t){(t.checklist||[]).forEach(function(x){if(!agg[x.n]){agg[x.n]={ok:0};order.push(x.n);}if(x.ok)agg[x.n].ok++;});});
 var N=rg.length,fin=DATA.ratkit.reg.final,complete=pcnt(rg,fin),notc=N-complete;
 var b=lensH("📊 มุมงาน");
 b+='<div class="kpis k4">'+kpiC(N,"📋 สาขากำลังทำ")+kpiC(p.ratkit.reg_over,"🔴 เลย D-day","bad")+kpiC(notc,"🟠 ยังไม่ครบ","warn")+kpiC(complete,"✅ ครบทุกใบ",complete>0?"good":"bad")+'</div>';
 b+='<div class="pfun">'+order.map(function(n){var ok=agg[n].ok;return pfrow(n,ok+"/"+N,Math.round(100*ok/N),ok<N*0.5?"hot":(ok>=N*0.9?"done":""),"drillTrack(\'reg\')");}).join("")+'</div>';
 b+=lensH("🧑 มุมรายคน");
 b+=psolo("หมิว","tl","ดูแลงานทะเบียนทั้งหมด",[[N,"สาขาในมือ",""],[p.ratkit.reg_over,"เลย D-day","bad"],[notc,"ยังไม่ครบ","warn"],[complete,"ครบแล้ว","good"]]);
 b+='<div class="note">ท่อนทะเบียนมีหมิวดูแลคนเดียว → รายคน = โหลดของหมิว</div>';
 b+=lensH("🚨 เร่งด่วน + เสี่ยงเปิดร้านเลื่อน",1);
 var worst=order.map(function(n){return {n:n,ok:agg[n].ok};}).sort(function(a,c){return a.ok-c.ok;}).slice(0,3);
 b+='<div class="prisk">'+worst.map(function(w){var miss=N-w.ok;return rr(miss>=N*0.5?"hi":"md",w.n+" — ค้าง "+miss+" สาขา","ได้แล้ว "+w.ok+"/"+N+" สาขา","🔴 "+miss,"drillTrack(\'reg\')");}).join("")+'</div>';
 b+=pdelay("📋","สาขาถึงวันเปิดแต่เอกสารไม่ครบ ("+complete+"/"+N+" ครบ)","ตัวฉุดหลัก = ใบที่ค้างเยอะสุดข้างบน → เปิดแล้วเสี่ยงโดนปรับ/ระงับ");
 return b;}

function dashSearch(q){var box=document.getElementById("dqres");if(!box)return;q=(q||"").trim().toLowerCase();
 if(!q){box.innerHTML="";return;}
 var all=[],ic={neg:"🤝",o1:"🎫",reg:"📋"};
 DATA.nego.tasks.forEach(function(t){all.push({t:t,k:"neg"});});
 DATA.ratkit.o1.tasks.forEach(function(t){all.push({t:t,k:"o1"});});
 DATA.ratkit.reg.tasks.forEach(function(t){all.push({t:t,k:"reg"});});
 var hits=all.filter(function(x){return ((x.t.code||"")+" "+(x.t.name||"")+" "+(x.t.owner||"")+" "+(x.t.prov||"")).toLowerCase().indexOf(q)>=0;});
 var tot=hits.length;hits=hits.slice(0,30);
 if(!tot){box.innerHTML='<div class="dqempty">ไม่พบ "'+esc(q)+'"</div>';return;}
 box.innerHTML='<div class="dqlist">'+hits.map(function(x){return '<div class="dqrow" onclick="calOpen(\''+x.k+'\',\''+esc(x.t.code)+'\')"><span class="dqi">'+ic[x.k]+'</span><div class="dqx"><div class="dqc">'+esc(x.t.code)+' · '+esc(x.t.name)+'</div><div class="dqs">'+esc(x.t.step)+(x.t.owner?" · "+esc(x.t.owner):"")+'</div></div><span class="dqgo">เปิด ›</span></div>';}).join("")+(tot>30?'<div class="dqempty">+ อีก '+(tot-30)+' — พิมพ์ให้เจาะขึ้น</div>':"")+'</div>';}
function drillRk(sub,name){perfDrill("ratkit",sub,{search:name});}
function slaBarChart(){
 var EN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
 var rows=DATA.nego.tasks.filter(function(t){return t.ag!=null&&t.ag>=0&&t.ag<=1000;});
 var byM={},order=[];
 rows.forEach(function(t){var d=new Date(TODAY.getTime()-t.ag*86400000);if(d.getFullYear()<2026)return;var key=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);if(!byM[key]){byM[key]={lbl:EN[d.getMonth()]+"-"+(d.getFullYear()%100),rows:[]};order.push(key);}byM[key].rows.push(t);});
 order.sort();
 var mx=1;order.forEach(function(k){if(byM[k].rows.length>mx)mx=byM[k].rows.length;});
 var b='<div class="sec" style="margin-top:22px"><span class="dot"></span>📈 SLA เซ็นสัญญา — รายเดือน (เซ็น / รอเซ็น)</div>';
 b+='<div class="slaleg"><span><i class="lg-done"></i>เซ็นสัญญาแล้ว</span><span><i class="lg-wip"></i>รอเซ็นสัญญา</span><span class="cmut">ตัวเลขในแท่ง = จำนวนสัญญา · ล่าง = เกิน SLA + aging เฉลี่ย</span></div>';
 b+='<div class="slawrap"><div class="slabars">';
 order.forEach(function(k){var m=byM[k];var done=m.rows.filter(function(t){return t.signed;}).length,wip=m.rows.length-done;
   var ov=m.rows.filter(function(t){return t.ag>90&&!t.signed;}).length;
   var avg=m.rows.length?Math.round(m.rows.reduce(function(s,t){return s+t.ag;},0)/m.rows.length):0;
   var hd=Math.round(done/mx*170),hw=Math.round(wip/mx*170);
   b+='<div class="slacol"><div class="slabar">'
     +(wip?'<div class="segwip" style="height:'+Math.max(18,hw)+'px">'+wip+'</div>':'')
     +(done?'<div class="segdone" style="height:'+Math.max(18,hd)+'px">'+done+'</div>':'')
     +'</div><div class="slaxl"><b>'+esc(m.lbl)+'</b>'+(ov?'<span class="ov">🔴 เกิน SLA '+ov+'</span>':'<span class="okk">✓ ตรงเวลา</span>')+'<span>aging '+avg+' วัน</span></div></div>';});
 b+='</div></div>';
 return b;}
function dbStages(tasks,ss,finalStp){
 var maxc=1,rows=[];
 for(var i=0;i<ss.length;i++){var s=ss[i];if(s.stp===finalStp)continue;var list=tasks.filter(function(t){return t.step===s.stp;});var ov=list.filter(function(t){return t.st==="red";}).length;if(list.length>maxc)maxc=list.length;rows.push({lbl:s.stp,n:list.length,ov:ov});}
 if(!rows.length)return '<div class="dempty">ไม่มีงานค้าง 🎉</div>';
 return '<div class="dstage">'+rows.map(function(r){var w=Math.round(r.n/maxc*100);var ovw=r.n?Math.round(r.ov/r.n*100):0;return '<div class="dsrowb"><div class="dslbl">'+esc(r.lbl)+'</div><div class="dstrk"><span class="dsfill" style="width:'+Math.max(w,r.n?4:0)+'%"><i class="segov" style="width:'+ovw+'%"></i><i class="segok" style="width:'+(100-ovw)+'%"></i></span></div><div class="dsval"><b>'+r.n+'</b>'+(r.ov?'<span class="ov">เกิน '+r.ov+'</span>':'')+'</div></div>';}).join("")+'</div>';}
function dbUrgent(tasks,trk,finalStp){
 var pend=tasks.filter(function(t){return t.step!==finalStp;});
 pend.sort(function(a,c){var ao=a.st==="red"?1:0,co=c.st==="red"?1:0;if(ao!==co)return co-ao;var ag=(a.ag==null?-1:a.ag),cg=(c.ag==null?-1:c.ag);return cg-ag;});
 var top=pend.slice(0,8);
 if(!top.length)return '<div class="dlist"><div class="dempty">ไม่มีงานค้าง 🎉</div></div>';
 return '<div class="dlist">'+top.map(function(t){
   var days=(t.ag!=null&&t.ag>=0)?(t.ag+' วัน'):(t.slatxt||'ค้าง');
   var cls=(t.st==="red")?'':' md';
   var meta=[t.prov,t.owner,t.step].filter(Boolean).map(esc).join(' · ');
   return '<div class="dlrow" onclick="calOpen(\''+trk+'\',\''+esc(t.code)+'\')"><div class="dlx"><div class="dlc">'+esc(t.code)+' · '+esc(t.name||"")+'</div><div class="dls">'+meta+'</div></div><span class="dldays'+cls+'">'+esc(days)+'</span></div>';}).join("")+'</div>';}
function dbRegDocs(tasks,N){
 var agg={},order=[];
 tasks.forEach(function(t){(t.checklist||[]).forEach(function(x){if(!agg[x.n]){agg[x.n]={ok:0,ov:0};order.push(x.n);}if(x.ok)agg[x.n].ok++;else if(x.st==="red")agg[x.n].ov++;});});
 if(!order.length)return '<div class="dempty">ไม่มีข้อมูลเอกสาร</div>';
 return '<div class="dstage">'+order.map(function(n){var d=agg[n];var w=N?Math.round(d.ok/N*100):0;return '<div class="dsrowb"><div class="dslbl">'+esc(n)+'</div><div class="dstrk"><span class="dsfill" style="width:'+Math.max(w,3)+'%"><i class="segok" style="width:100%"></i></span></div><div class="dsval"><b>'+d.ok+'</b><span style="color:var(--faint)">/'+N+'</span>'+(d.ov?'<span class="ov">เลย '+d.ov+'</span>':'')+'</div></div>';}).join("")+'</div>';}
