<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CJX Inspect · Dashboard (HQ)</title>
<style>
  :root{--bg:#0D0D0E;--ink:#F6F6F2;--mut:#9C9C93;--faint:#66665f;--y:#F5C518;--yInk:#1A1500;
    --line:#26262b;--card:#17181B;--card2:#1c1d21;--pass:#37D98B;--fail:#FF6B6B;--build:#FF9F1C;--idle:#5a5a55;--main:#8FB4FF;--sub:#F5A524}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  a{color:inherit}

  /* login */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px}
  .brand{font-weight:800;font-size:20px;letter-spacing:.02em;margin-bottom:4px}.brand b{color:var(--y)}
  .lsub{font-size:13px;color:var(--mut);margin-bottom:22px}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
  input{width:100%;background:#0e0e0f;border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--ink);font-size:15px;font-family:inherit}
  input:focus{outline:2px solid var(--y);border-color:var(--y)}
  .btn{width:100%;margin-top:20px;background:var(--y);color:var(--yInk);border:0;border-radius:11px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
  .msg{font-size:12.5px;margin-top:12px;min-height:16px}.msg.err{color:var(--fail)}.msg.ok{color:var(--pass)}

  /* dashboard */
  #dash{display:none;padding:22px clamp(16px,3vw,40px) 60px;max-width:1500px;margin:0 auto}
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .top .h{font-size:clamp(20px,2.4vw,30px);font-weight:800;letter-spacing:-.02em}
  .top .h b{color:var(--y)}
  .top .sp{flex:1}
  .top .meta{font-size:12px;color:var(--faint);text-align:right}
  .tbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .tbtn.on{border-color:#3a3520;color:var(--y)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  @media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
  .searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 15px;margin-bottom:16px;color:var(--faint)}
  .searchbar input{flex:1;background:none;border:0;color:var(--ink);font-size:15px;font-family:inherit;outline:none}
  .searchbar .qx{display:none;cursor:pointer;font-size:13px;color:var(--mut);width:22px;height:22px;align-items:center;justify-content:center;border-radius:50%;background:#2a2a2e}
  .modebar{display:inline-flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:18px}
  .modebar b{font-size:13px;font-weight:800;color:var(--mut);padding:9px 18px;border-radius:9px;cursor:pointer}
  .modebar b.on{background:var(--y);color:var(--yInk)}
  .gradeb{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);font-family:ui-monospace,monospace;font-weight:800;font-size:14px;margin-right:9px;vertical-align:middle}
  tr.clk{cursor:pointer}
  .detov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto}
  .detcard{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .deth{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);background:#141519}
  .detn{font-size:16px;font-weight:800}.detm{font-size:12px;color:var(--mut);margin-top:3px}
  .detx{font-size:18px;color:var(--mut);cursor:pointer;line-height:1;padding:2px 8px}
  .repbtn{background:var(--y,#F5C518);color:#1A1500;border:0;border-radius:9px;padding:8px 13px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
  .detbody{padding:14px 18px 20px;max-height:72vh;overflow-y:auto}
  .detsec{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px}
  .detsh{font-size:13px;font-weight:800;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
  .detcnt{font-size:11px;color:var(--mut);font-weight:600}
  .detfail{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
  .dfl{font-size:12px;color:var(--fail);font-weight:600}
  .dfph{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .dfph img,.dthumb{width:56px;height:56px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:pointer}
  .detitem{border-top:1px solid var(--line);padding:9px 0}
  .dtop{display:flex;gap:8px;align-items:flex-start}
  .dst{font-weight:800;font-size:13px;flex:0 0 auto;line-height:1.35}
  .dfl2{font-size:12.5px;color:var(--ink);line-height:1.35}
  .detlb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:120;display:none;align-items:center;justify-content:center}
  .detlb img{max-width:94vw;max-height:88vh;object-fit:contain;border-radius:8px}
  .dlbx{position:absolute;top:18px;right:22px;color:#fff;font-size:26px;cursor:pointer;z-index:2}
  .dlbnav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:44px;cursor:pointer;padding:10px 18px;user-select:none;opacity:.85}
  .dlbnav.prev{left:6px}.dlbnav.next{right:6px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 18px;cursor:pointer}
  .kpi.on{border-color:var(--y)}
  .kpi .v{font-size:clamp(28px,3.4vw,40px);font-weight:800;line-height:1}
  .kpi .k{font-size:12.5px;color:var(--mut);margin-top:6px}
  .statusbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#26262b;margin-bottom:8px}
  .statusbar i{height:100%}
  .lg{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:22px}
  .lg span{display:flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:3px}
  /* insight panels */
  .ins{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  @media(max-width:820px){.ins{grid-template-columns:1fr}}
  .inscard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 17px}
  .inst{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:7px}
  .inssub{font-size:11px;color:var(--faint);margin-bottom:8px}
  .insrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
  .insrow:first-of-type{border-top:0}
  .insrow .rk{font-family:ui-monospace,monospace;color:var(--faint);font-size:11px;width:16px;flex:0 0 auto}
  .insrow .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .insrow .lbl small{color:var(--faint);font-weight:400}
  .insrow .insbar{width:64px;height:7px;border-radius:99px;background:#26262b;overflow:hidden;flex:0 0 auto}.insbar i{display:block;height:100%;border-radius:99px}
  .insrow .cnt{font-weight:800;font-family:ui-monospace,monospace;flex:0 0 auto;min-width:20px;text-align:right}
  .insempty{font-size:12px;color:var(--faint);padding:10px 0}

  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}
  .thead{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}
  .thead .tt{font-size:14px;font-weight:800}
  .thead .flab{font-size:12px;color:var(--y);cursor:pointer}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:11px 14px;background:#131418;white-space:nowrap}
  td{padding:12px 14px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle}
  tr:hover td{background:#1b1c20}
  .stname{font-weight:700}.stmeta{font-size:11px;color:var(--faint);margin-top:2px}
  .cd{font-family:ui-monospace,monospace;color:var(--mut)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
  .bar{width:120px;height:8px;border-radius:99px;background:#26262b;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:9px}
  .bar i{display:block;height:100%;border-radius:99px}
  .pct{font-weight:800;font-family:ui-monospace,monospace}
  .days{font-weight:800;font-family:ui-monospace,monospace}
  .fail{color:var(--fail);font-weight:700}
  .num{text-align:right;font-family:ui-monospace,monospace}
  .empty{padding:40px;text-align:center;color:var(--faint)}
  .spin{padding:60px;text-align:center;color:var(--mut)}
  @media(max-width:820px){ .hidecol{display:none} }
</style></head><body>

<div id="login">
  <div class="lcard">
    <div class="brand">CJ<b>X</b> Inspect</div>
    <div class="lsub">Dashboard สำหรับ HQ · ภาพรวมก่อสร้าง + ตรวจรับ · เข้าดูด้วยบัญชีเดิม</div>
    <form id="lform">
      <label>อีเมล</label><input id="email" type="email" autocomplete="username" placeholder="you@cjmart.co.th">
      <label>รหัสผ่าน</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" type="submit">เข้าสู่ระบบ</button>
      <div class="msg" id="lmsg"></div>
    </form>
  </div>
</div>

<div id="dash">
  <div class="top">
    <div class="h">CJ<b>X</b> Inspect · <span style="font-weight:800">แดชบอร์ด HQ</span></div>
    <div class="sp"></div>
    <button class="tbtn" id="autoBtn">⟳ อัปเดตอัตโนมัติ: ปิด</button>
    <button class="tbtn" id="refBtn">รีเฟรช</button>
    <button class="tbtn" id="outBtn">ออกจากระบบ</button>
    <div class="meta" id="meta" style="width:100%"></div>
  </div>
  <div class="searchbar"><span>⌕</span><input id="q" placeholder="ค้นหาสาขา / รหัส / จังหวัด / ผรม."><span class="qx" id="qx">✕</span></div>
  <div id="body"><div class="spin">กำลังโหลดข้อมูล…</div></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const SUPABASE_URL='https://kmidlzhcdolxzpetecjx.supabase.co'
const SUPABASE_KEY='sb_publishable_4n3ZiIYvxYV335LLZe7Cnw_QHQeCJ3h'
const sb=createClient(SUPABASE_URL,SUPABASE_KEY)
const $=id=>document.getElementById(id)
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const CONSTRUCTION_DAYS=40
const DCOL={fail:'var(--fail)',done:'var(--pass)',progress:'var(--build)',idle:'var(--idle)'}
let _rows=[], _suRows=[], _filter='all', _mode='con', _auto=null, _names={}
let _cps=[], _cpMap={}, _storeMap={}, _inspByStore={}, _evsByStore={}, _detImgs=[], _detLbI=0, _q=''
const SETUP_SECTIONS=[[201,5],[202,10],[203,30],[204,30],[205,5],[206,10],[207,5],[208,5]]
let _setupCps=[]
function setupGrade(t){ return t>95?'A':t>=90?'B':t>=80?'C':'D' }
function gradeColor(g){ return g==='A'?'#37D98B':g==='B'?'#8FD14F':g==='C'?'#F5C518':'#FF6B6B' }
function computeSetupScore(cur){
  let total=0,gotMain=0,maxMain=0,gotSub=0,maxSub=0,doneItems=0,failItems=0,totalItems=0
  SETUP_SECTIONS.forEach(([ph,weight])=>{
    const items=_setupCps.filter(c=>c.phase===ph)
    const raw=items.reduce((s,c)=>s+(+c.points||1),0)||1
    items.forEach(c=>{ const w=(+c.points||1)/raw*weight, isSub=c.supplier==='ซัพย่อย'
      if(isSub) maxSub+=w; else maxMain+=w; totalItems++
      const e=cur[String(c.id)]
      if(e){ doneItems++; if(e.status==='fail') failItems++
        if(e.status==='pass'){ total+=w; if(isSub) gotSub+=w; else gotMain+=w } } })
  })
  return {total,grade:setupGrade(total),doneItems,totalItems,failItems,allDone:doneItems===totalItems&&totalItems>0,
    mainPct:maxMain?gotMain/maxMain*100:0, subPct:maxSub?gotSub/maxSub*100:0}
}

function cs(open){ if(!open) return {key:'unknown',days:null}
  const od=new Date(open+'T00:00:00'), now=new Date(); now.setHours(0,0,0,0)
  const days=Math.round((od-now)/86400000)
  const start=new Date(od); start.setDate(start.getDate()-CONSTRUCTION_DAYS)
  if(now>od) return {key:'opened',days}; if(now>=start) return {key:'building',days}; return {key:'notyet',days} }
function dstt(r){ if(r.fail>0) return 'fail'; if(r.total&&r.done>=r.total) return 'done'; if(r.done>0) return 'progress'; return 'idle' }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso),p=n=>String(n).padStart(2,'0')
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()+543} ${p(d.getHours())}:${p(d.getMinutes())}` }

async function boot(){ const {data:{session}}=await sb.auth.getSession(); if(session) enter(); else show('login') }
function show(w){ $('login').style.display=w==='login'?'flex':'none'; $('dash').style.display=w==='dash'?'block':'none' }
$('lform').onsubmit=async e=>{ e.preventDefault(); const m=$('lmsg'); m.className='msg'; m.textContent='กำลังเข้าสู่ระบบ…'
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value})
  if(error){ m.className='msg err'; m.textContent='เข้าไม่สำเร็จ: '+error.message; return } enter() }
$('outBtn').onclick=async()=>{ await sb.auth.signOut(); if(_auto)clearInterval(_auto); location.reload() }
$('refBtn').onclick=()=>load()
$('autoBtn').onclick=()=>{ if(_auto){ clearInterval(_auto); _auto=null; $('autoBtn').classList.remove('on'); $('autoBtn').textContent='⟳ อัปเดตอัตโนมัติ: ปิด' }
  else { _auto=setInterval(load,60000); $('autoBtn').classList.add('on'); $('autoBtn').textContent='⟳ อัปเดตอัตโนมัติ: เปิด (60วิ)'; load() } }
async function enter(){ show('dash')
  $('q').oninput=e=>{ _q=e.target.value; $('qx').style.display=_q?'flex':'none'; render() }
  $('qx').onclick=()=>{ _q=''; $('q').value=''; $('qx').style.display='none'; $('q').focus(); render() }
  await load() }

async function load(){
  const [{data:stores},{data:cps},{data:insps},{data:evs},{data:sgs},{data:profs}] = await Promise.all([
    sb.from('stores').select('code,name,province,opening_date,contractor'),
    sb.from('checkpoints').select('id,phase,no,label,phase_name,points,supplier,sort'),
    sb.from('inspections').select('id,store_code,phase'),
    sb.from('check_events').select('inspection_id,checkpoint,round,status,by,created_at'),
    sb.from('signoffs').select('store_code,kind'),
    sb.from('profiles').select('id,name,email')
  ])
  ;(profs||[]).forEach(p=>_names[p.id]=p.name||p.email||'—')
  // เก็บไว้ทำหน้ารายละเอียดรายสาขา
  _cps=cps||[]; _cpMap={}; _cps.forEach(c=>_cpMap[String(c.id)]=c)
  _storeMap={}; (stores||[]).forEach(s=>_storeMap[s.code]={...s,cs:cs(s.opening_date)})
  _inspByStore={}; (insps||[]).forEach(i=>{ (_inspByStore[i.store_code]||(_inspByStore[i.store_code]=[])).push(i.id) })
  const conIds=new Set((cps||[]).filter(c=>c.phase<200).map(c=>String(c.id)))   // ก่อสร้าง+Pre-Con (ไม่รวม Set-Up)
  const totalCP=conIds.size||1
  const cpPhase={}; (cps||[]).forEach(c=>cpPhase[String(c.id)]=c.phase)
  const inspById={}; (insps||[]).forEach(i=>inspById[i.id]=i)
  _evsByStore={}; (evs||[]).forEach(e=>{ const ins=inspById[e.inspection_id]; if(!ins) return; (_evsByStore[ins.store_code]||(_evsByStore[ins.store_code]=[])).push(e) })
  const agg={}
  ;(evs||[]).forEach(e=>{ const ins=inspById[e.inspection_id]; if(!ins||!conIds.has(e.checkpoint)) return
    const a=agg[ins.store_code]||(agg[ins.store_code]={cur:{},last:null})
    const k=e.checkpoint; if(!a.cur[k]||e.round>a.cur[k].round) a.cur[k]=e
    if(!a.last||(e.created_at&&e.created_at>a.last.at)) a.last={at:e.created_at,by:e.by} })
  const handover=new Set((sgs||[]).filter(x=>x.kind==='handover').map(x=>x.store_code))
  const scoped=(stores||[]).map(s=>({...s,cs:cs(s.opening_date)})).filter(s=>s.cs.key==='building'||agg[s.code])
  _rows=scoped.map(s=>{ const a=agg[s.code]||{cur:{},last:null}, vals=Object.values(a.cur)
    let phase=0; Object.keys(a.cur).forEach(k=>{ const p=cpPhase[k]; if(p&&p<200&&p>phase&&p<100) phase=p })
    return {code:s.code,name:s.name||s.code,prov:s.province||'',contractor:s.contractor||'',
      days:s.cs.days, done:vals.length, pass:vals.filter(e=>e.status==='pass').length, fail:vals.filter(e=>e.status==='fail').length,
      phase, total:totalCP, pct:Math.round(vals.length/totalCP*100), last:a.last, closed:handover.has(s.code)} })
  // ---- ฝั่งตรวจรับ Set-Up (phase 201-208) ----
  _setupCps=(cps||[]).filter(c=>c.phase>=201&&c.phase<=208)
  const suIds=new Set(_setupCps.map(c=>String(c.id)))
  const sagg={}
  ;(evs||[]).forEach(e=>{ const ins=inspById[e.inspection_id]; if(!ins||!suIds.has(e.checkpoint)) return
    const a=sagg[ins.store_code]||(sagg[ins.store_code]={cur:{},last:null})
    const k=e.checkpoint; if(!a.cur[k]||e.round>a.cur[k].round) a.cur[k]=e
    if(!a.last||(e.created_at&&e.created_at>a.last.at)) a.last={at:e.created_at,by:e.by} })
  const suSigned=new Set((sgs||[]).filter(x=>x.kind==='setup_nsa').map(x=>x.store_code))
  const suScoped=(stores||[]).map(s=>({...s,cs:cs(s.opening_date)})).filter(s=>s.cs.key==='building'||sagg[s.code])
  _suRows=suScoped.map(s=>{ const a=sagg[s.code]||{cur:{},last:null}; const sc=computeSetupScore(a.cur)
    return {code:s.code,name:s.name||s.code,prov:s.province||'',days:s.cs.days,
      score:sc.total,grade:sc.grade,done:sc.doneItems,total:sc.totalItems,fail:sc.failItems,allDone:sc.allDone,
      mainPct:sc.mainPct,subPct:sc.subPct,signed:suSigned.has(s.code),last:a.last} })
  render()
  const d=new Date(),p=n=>String(n).padStart(2,'0')
  $('meta').textContent=`อัปเดตล่าสุด ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} · ${_rows.length} สาขา`
}

function render(){
  const toggle=`<div class="modebar"><b class="${_mode==='con'?'on':''}" data-m="con">🏗️ ก่อสร้าง</b><b class="${_mode==='setup'?'on':''}" data-m="setup">🏪 ตรวจรับ (Set-Up)</b></div>`
  if(_mode==='setup') return renderSetup(toggle)
  const rows=_rows
  const near=rows.filter(r=>r.days!=null&&r.days<=7&&!r.closed).length
  const failStores=rows.filter(r=>r.fail>0).length, fails=rows.reduce((n,r)=>n+r.fail,0)
  const build=rows.filter(r=>r.cs?true:true).length // building/active scoped
  const done100=rows.filter(r=>r.done>=r.total&&r.fail===0).length
  const cnt={idle:0,progress:0,fail:0,done:0}; rows.forEach(r=>cnt[dstt(r)]++)
  const tot=rows.length||1
  const on=f=>_filter===f?' on':''
  const kpis=`<div class="kpis">
    <div class="kpi${on('all')}" data-f="all"><div class="v" style="color:var(--build)">${rows.length}</div><div class="k">สาขากำลังก่อสร้าง</div></div>
    <div class="kpi${on('fail')}" data-f="fail"><div class="v" style="color:var(--fail)">${failStores}</div><div class="k">สาขาต้องแก้${fails?' · '+fails+' จุด':''}</div></div>

function curOfStore(code){ const cur={}; (_evsByStore[code]||[]).forEach(e=>{ if(!cur[e.checkpoint]||e.round>cur[e.checkpoint].round) cur[e.checkpoint]=e }); return cur }
function topFails(setup){ const cnt={}, st={}

function contractorSummary(){ const m={}

function rSetupScore(cur){
  let total=0,gotMain=0,maxMain=0,gotSub=0,maxSub=0,doneItems=0,failItems=0,fixedItems=0,totalItems=0
  const sections=SETUP_SEC.map(([ph,name,weight])=>{ const items=_setupCps.filter(c=>c.phase===ph)
    const raw=items.reduce((s,c)=>s+(+c.points||1),0)||1; let earned=0,done=0,fail=0,fixed=0

        else if(e.status==='pass'){earned+=w; if(isSub)gotSub+=w; else gotMain+=w} } })
    total+=earned; return {ph,name,weight,earned,done,fail,fixed,total:items.length} })
  return {total,grade:setupGrade(total),sections,doneItems,totalItems,failItems,fixedItems,
    mainPct:maxMain?gotMain/maxMain*100:0, subPct:maxSub?gotSub/maxSub*100:0, allDone:doneItems===totalItems&&totalItems>0}

.verdict.p{background:#e6f7ee;color:#137a43;border:1px solid #9ad9b8}.verdict.f{background:#fdeeee;color:#c0392b;border:1px solid #e6b0b0}
.scorebox{display:flex;align-items:center;gap:20px;background:#f2fbf6;border:1px solid #bfe6d0;border-radius:12px;padding:16px 20px;margin:6px 0}
.scorebox .g{font-size:46px;font-weight:800;color:#137a43;min-width:56px;text-align:center}.scorebox.f .g{color:#c0392b}
.scorebox .num{font-size:20px;font-weight:800}.scorebox .sub{color:#555;font-size:12.5px}
.split{display:flex;gap:10px;margin:10px 0}.split div{flex:1;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:700}
.split .m{background:#eef4ff;border:1px solid #cdddff;color:#2d5bb8}.split .y{background:#fff6e8;border:1px solid #f0dcae;color:#a5701a}
.issued{color:#777;font-size:12px;margin-top:12px}
.failbox{border:1.5px solid #e6b0b0;background:#fdf5f5;border-radius:12px;padding:14px 16px;margin-bottom:22px}
.failh{font-weight:800;font-size:14px;color:#c0392b;margin-bottom:10px}
.fitem{padding:9px 0;border-top:1px solid #f0d5d5}.fitem:first-of-type{border-top:0}
.fhd{font-weight:700;font-size:12.5px;color:#333}.fno{color:#c0392b;font-weight:800;margin-right:4px}.fph{color:#999;font-weight:600;font-size:11px}
.ftag{font-size:10px;font-weight:800;color:#c0392b;background:#fdeaea;border-radius:5px;padding:1px 7px;margin-left:4px}.ftag.fx{color:#a5701a;background:#fff6e8}
.fnt{color:#b06a00;font-size:11.5px;margin:3px 0}.fimgs img{width:74px;height:74px;object-fit:cover;border-radius:6px;margin:2px;border:1px solid #e0b0b0}.fnoimg{color:#c0392b;font-size:11px}
h2{font-size:15px;margin:24px 0 8px;padding-bottom:6px;border-bottom:2px solid #eee;page-break-after:avoid}
.okpill{font-size:11px;font-weight:700;color:#137a43;background:#e6f7ee;border-radius:99px;padding:2px 9px;float:right}
table{width:100%;border-collapse:collapse;margin-bottom:8px}th{background:#f4f4f4;text-align:left;font-size:11px;color:#555;padding:7px 8px;border:1px solid #e2e2e2}
td{padding:7px 8px;border:1px solid #e8e8e8;vertical-align:top;font-size:12px}td.st{font-weight:800;white-space:nowrap;width:74px}td.mt{color:#666;font-size:11px;width:118px}
td.im{width:160px}td.im img{width:70px;height:70px;object-fit:cover;border-radius:6px;margin:2px;border:1px solid #ddd}
.grp{background:#fafafa;font-weight:800;color:#444;font-size:11.5px}.nt{color:#b06a00;font-size:11px;margin-top:3px}
.sign{display:flex;gap:24px;margin-top:40px;page-break-inside:avoid}.sign>div{flex:1;text-align:center;font-size:12px;color:#555}
.sign img{max-height:60px;max-width:92%;object-fit:contain;display:block;margin:0 auto 2px}.sign .sigsp{height:48px}
.sign .slab{border-top:1px solid #999;padding-top:6px;margin:0 8px;font-weight:700;color:#333}.sign .sby{font-size:10px;color:#888;margin-top:4px}
.noprint{margin-bottom:16px}.noprint button{background:#F5C518;border:0;border-radius:10px;padding:12px 20px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
@media print{.noprint{display:none}body{padding:0}}`

async function genReport(code){
  const s=_storeMap[code]||{code}; const setup=_mode==='setup'
  const ids=_inspByStore[code]||[]
  let events=[],media=[]
  if(ids.length){
    const {data:ev}=await sb.from('check_events').select('inspection_id,checkpoint,round,status,note,by,created_at').in('inspection_id',ids); events=ev||[]
    const {data:m}=await sb.from('media').select('checkpoint,path,kind').in('inspection_id',ids); media=m||[]
    if(media.length){ const {data:u}=await sb.storage.from('media').createSignedUrls(media.map(x=>x.path),3600); media.forEach((x,i)=>x.url=(u&&u[i]&&u[i].signedUrl)||'') }
  }
  const {data:sg}=await sb.from('signoffs').select('scope,kind,by,created_at,image,note').eq('store_code',code); const sgs=sg||[]
  const {data:{user}}=await sb.auth.getUser(); const meName=(user&&user.email)||''
  const cur={}; events.forEach(e=>{ const k=e.checkpoint; if(!cur[k]||e.round>cur[k].round) cur[k]=e })
  const mBy={}; media.forEach(m=>{ (mBy[m.checkpoint]||(mBy[m.checkpoint]=[])).push(m) })
  const dd=new Date(),p2=n=>String(n).padStart(2,'0'),today=`${p2(dd.getDate())}/${p2(dd.getMonth()+1)}/${dd.getFullYear()+543}`
  const imgs=arr=>arr.map(m=>m.kind==='video'?`<a href="${m.url||''}" target="_blank">🎥 วิดีโอ</a>`:`<a href="${m.url||''}" target="_blank"><img src="${m.url||''}"></a>`).join('')||'—'
  const pick=(kind,scope)=>{ const a=sgs.filter(x=>x.kind===kind&&(scope==null||String(x.scope)===String(scope))); return a.length?a.reduce((p,c)=>((c.created_at||'')>(p.created_at||'')?c:p)):null }
  let body='', failList=[], head='', signHtml=''
  if(setup){
    const sc=rSetupScore(cur)
    SETUP_SEC.forEach(([pn,name,weight])=>{ const items=_setupCps.filter(c=>c.phase===pn).sort((a,b)=>(a.sort||0)-(b.sort||0))
      const ss=sc.sections.find(x=>x.ph===pn)||{earned:0,done:0,total:items.length}
      let rows=''
      items.forEach(c=>{ const e=cur[String(c.id)]; const ims=mBy[String(c.id)]||[]
        if(e&&(e.status==='fail'||e.status==='fixed')) failList.push({c,e,name})
        const sup=c.supplier==='ซัพย่อย'?'<span style="color:#a5701a">·ย่อย</span>':(c.supplier?'<span style="color:#2d5bb8">·หลัก</span>':'')
        rows+=`<tr><td>${esc(c.label)} ${sup}${e&&e.note?`<div class="nt">หมายเหตุ: ${esc(e.note)}</div>`:''}</td><td class="st" style="color:${rStatusCol(e&&e.status)}">${rStatusTxt(e&&e.status)}</td><td class="mt">${e?nameOf(e.by)+'<br><small>'+fmtDate(e.created_at)+'</small>':'—'}</td><td class="im">${imgs(ims)}</td></tr>` })
      body+=`<h2>${esc(name)} <span class="okpill">${ss.earned.toFixed(1)}/${weight}</span></h2><table><thead><tr><th>รายการตรวจรับ</th><th>ผล</th><th>ผู้ตรวจ/เวลา</th><th>หลักฐาน</th></tr></thead><tbody>${rows}</tbody></table>` })
    const passAll=sc.allDone&&sc.failItems===0&&sc.fixedItems===0
    const nsa=pick('setup_nsa'), cmSig=pick('setup_cm'), cmName=rSetupCmName(sgs), ho=sgs.find(x=>x.scope==='store'&&x.kind==='handover')
    head=`<h1>ใบตรวจรับร้าน (Set-Up · NSA)</h1><div class="site">${esc(s.name||code)} <span>(${esc(code)})</span></div>
      <div class="scope">ตรวจรับอาคารจากทีมก่อสร้าง · ให้คะแนน 8 หมวด (100)${s.province?' · '+esc(s.province):''}</div>
      <div class="scorebox ${passAll?'':'f'}"><div class="g">${sc.doneItems?sc.grade:'—'}</div><div><div class="num">${sc.total.toFixed(0)} / 100 คะแนน</div><div class="sub">${passAll?'✓ ผ่าน 100% พร้อมรับร้าน':`ตรวจแล้ว ${sc.doneItems}/${sc.totalItems}${sc.failItems?' · '+sc.failItems+' ไม่ผ่าน':''}${sc.fixedItems?' · '+sc.fixedItems+' รอตรวจซ้ำ':''}`}</div></div></div>
      <div class="split"><div class="m">ซัพหลัก ${sc.mainPct.toFixed(0)}%</div><div class="y">ซัพย่อย ${sc.subPct.toFixed(0)}%</div></div>
      <div class="issued">ออกเอกสาร ${today} โดย ${esc(meName)}</div>`
    signHtml=`<div class="sign"><div>${nsa&&nsa.image?`<img src="${nsa.image}">`:'<div class="sigsp"></div>'}<div class="slab">ผู้ตรวจรับ (Set-Up / NSA)</div>${nsa?`<div class="sby">${esc(nameOf(nsa.by))}<br>${fmtDate(nsa.created_at)}</div>`:''}</div>
      <div>${cmSig&&cmSig.image?`<img src="${cmSig.image}">`:'<div class="sigsp"></div>'}<div class="slab">ทีมก่อสร้าง (CM)</div><div class="sby">${(cmSig?(nameOf(cmSig.by)||cmName):cmName)?esc(cmSig?(nameOf(cmSig.by)||cmName):cmName):'—'}${cmSig?'<br>'+fmtDate(cmSig.created_at):(ho?'<br>รับมอบงาน '+fmtDate(ho.created_at):'')}</div></div></div>`
  } else {
    const phs=[...new Set(_cps.filter(c=>c.phase<200).map(c=>c.phase))].sort((a,b)=>a-b)
    let totIn=0,totPass=0,totFail=0
    phs.forEach(pn=>{ const items=_cps.filter(c=>c.phase===pn).sort((a,b)=>(a.sort||0)-(b.sort||0))
      const withEv=items.filter(c=>cur[String(c.id)]); if(!withEv.length) return
      const pName=(items[0]&&items[0].phase_name)||('ครั้งที่ '+pn); let rows=''
      withEv.forEach(c=>{ const e=cur[String(c.id)]; const ims=mBy[String(c.id)]||[]; totIn++
        if(e.status==='pass')totPass++; else if(e.status==='fail'){totFail++; failList.push({c,e,name:pName})}
        rows+=`<tr><td class="mt" style="width:40px;color:#888;font-family:monospace">${esc(c.no||'')}</td><td>${esc(c.label)}${e.note?`<div class="nt">หมายเหตุ: ${esc(e.note)}</div>`:''}</td><td class="st" style="color:${rStatusCol(e.status)}">${rStatusTxt(e.status)}</td><td class="mt">${nameOf(e.by)}<br><small>${fmtDate(e.created_at)}</small></td><td class="im">${imgs(ims)}</td></tr>` })
      body+=`<h2>${esc(pName)}</h2><table><thead><tr><th>ข้อ</th><th>รายการตรวจ</th><th>ผล</th><th>ผู้ตรวจ/เวลา</th><th>หลักฐาน</th></tr></thead><tbody>${rows}</tbody></table>` })
    const passAll=totIn>0&&totFail===0
    const cmS=pick('sign_cm',null), conS=pick('sign_contractor',null), ho=pick('handover','store')
    head=`<h1>ใบรับรองการตรวจงานก่อสร้าง</h1><div class="site">${esc(s.name||code)} <span>(${esc(code)})</span></div>
      <div class="scope">รายงานตรวจงานทั้งโครงการ${s.province?' · '+esc(s.province):''}${s.contractor?' · ผรม. '+esc(s.contractor):''}</div>
      <div class="verdict ${passAll?'p':'f'}">${passAll?`✓ ผ่าน 100% (${totPass}/${totIn})`:`ผ่าน ${totPass} · ไม่ผ่าน ${totFail} · ตรวจแล้ว ${totIn}`}</div>
      <div class="issued">ออกเอกสาร ${today} โดย ${esc(meName)}${ho?' · รับมอบงานแล้ว '+fmtDate(ho.created_at):''}</div>`
    signHtml=`<div class="sign"><div>${cmS&&cmS.image?`<img src="${cmS.image}">`:'<div class="sigsp"></div>'}<div class="slab">ผู้ตรวจ (CM)</div>${cmS?`<div class="sby">${esc(nameOf(cmS.by))}</div>`:''}</div><div>${conS&&conS.image?`<img src="${conS.image}">`:'<div class="sigsp"></div>'}<div class="slab">ผู้รับเหมา (ผรม.)</div><div class="sby">${esc(s.contractor||'')}</div></div></div>`
  }
  const failHtml=failList.length?`<div class="failbox"><div class="failh">⚠ สรุปจุดที่ไม่ผ่าน ${failList.length} รายการ</div>`+failList.map(({c,e,name})=>{ const ims=mBy[String(c.id)]||[]
      const tag=e.status==='fixed'?'<span class="ftag fx">CM แก้แล้ว · รอตรวจซ้ำ</span>':'<span class="ftag">ไม่ผ่าน</span>'
      return `<div class="fitem"><div class="fhd"><span class="fno">•</span> ${esc(c.label)} <span class="fph">${esc(name)}</span> ${tag}</div>${e.note?`<div class="fnt">หมายเหตุ: ${esc(e.note)}</div>`:''}<div class="fimgs">${ims.length?imgs(ims):'<span class="fnoimg">— ยังไม่มีรูป —</span>'}</div></div>` }).join('')+`</div>`:''
  const html=`<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ใบตรวจรับ ${esc(s.name||code)}</title><style>${R_CSS}</style></head><body>
    <div class="noprint"><button onclick="window.print()">🖨️ พิมพ์ / บันทึก PDF</button></div>
    <div class="cert ${setup?'su':''}"><div class="brand">CJ<b>X</b> INSPECT</div>${head}</div>
    ${failHtml}${body||'<p style="color:#999">ยังไม่มีข้อมูลการตรวจ</p>'}${signHtml}</body></html>`
  const w=window.open('','_blank'); if(!w){ alert('เปิดแท็บใหม่ไม่ได้ — โปรดอนุญาต popup ของเว็บนี้'); return }
  w.document.write(html); w.document.close()
}

boot()
</script>
</body></html>
