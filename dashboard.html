<!doctype html><html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CJX Inspect · Dashboard ก่อสร้าง</title>
<style>
  :root{--bg:#0D0D0E;--ink:#F6F6F2;--mut:#9C9C93;--faint:#66665f;--y:#F5C518;--yInk:#1A1500;
    --line:#26262b;--card:#17181B;--card2:#1c1d21;--pass:#37D98B;--fail:#FF6B6B;--build:#FF9F1C;--idle:#5a5a55}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  a{color:inherit}

  /* login */
  #login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px}
  .brand{font-weight:800;font-size:20px;letter-spacing:.02em;margin-bottom:4px}.brand b{color:var(--y)}
  .lsub{font-size:13px;color:var(--mut);margin-bottom:22px}
  label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
  input{width:100%;background:#0e0e0f;border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--ink);font-size:15px;font-family:inherit}
  input:focus{outline:2px solid var(--y);border-color:var(--y)}
  .btn{width:100%;margin-top:20px;background:var(--y);color:var(--yInk);border:0;border-radius:11px;padding:13px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit}
  .msg{font-size:12.5px;margin-top:12px;min-height:16px}.msg.err{color:var(--fail)}.msg.ok{color:var(--pass)}

  /* dashboard */
  #dash{display:none;padding:22px clamp(16px,3vw,40px) 60px;max-width:1500px;margin:0 auto}
  .top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .top .h{font-size:clamp(20px,2.4vw,30px);font-weight:800;letter-spacing:-.02em}
  .top .h b{color:var(--y)}
  .top .sp{flex:1}
  .top .meta{font-size:12px;color:var(--faint);text-align:right}
  .tbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .tbtn.on{border-color:#3a3520;color:var(--y)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  @media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 18px;cursor:pointer}
  .kpi.on{border-color:var(--y)}
  .kpi .v{font-size:clamp(28px,3.4vw,40px);font-weight:800;line-height:1}
  .kpi .k{font-size:12.5px;color:var(--mut);margin-top:6px}
  .statusbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:#26262b;margin-bottom:8px}
  .statusbar i{height:100%}
  .lg{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-bottom:22px}
  .lg span{display:flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:3px}

  .tablewrap{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}
  .thead{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}
  .thead .tt{font-size:14px;font-weight:800}
  .thead .flab{font-size:12px;color:var(--y);cursor:pointer}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:11px 14px;background:#131418;white-space:nowrap}
  td{padding:12px 14px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle}
  tr:hover td{background:#1b1c20}
  .stname{font-weight:700}.stmeta{font-size:11px;color:var(--faint);margin-top:2px}
  .cd{font-family:ui-monospace,monospace;color:var(--mut)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
  .bar{width:120px;height:8px;border-radius:99px;background:#26262b;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:9px}
  .bar i{display:block;height:100%;border-radius:99px}
  .pct{font-weight:800;font-family:ui-monospace,monospace}
  .days{font-weight:800;font-family:ui-monospace,monospace}
  .fail{color:var(--fail);font-weight:700}
  .num{text-align:right;font-family:ui-monospace,monospace}
  .empty{padding:40px;text-align:center;color:var(--faint)}
  .spin{padding:60px;text-align:center;color:var(--mut)}
  @media(max-width:820px){ .hidecol{display:none} }
</style></head><body>

<div id="login">
  <div class="lcard">
    <div class="brand">CJ<b>X</b> Inspect</div>
    <div class="lsub">Dashboard ภาพรวมงานก่อสร้าง · เข้าดูด้วยบัญชีเดิม</div>
    <form id="lform">
      <label>อีเมล</label><input id="email" type="email" autocomplete="username" placeholder="you@cjmart.co.th">
      <label>รหัสผ่าน</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" type="submit">เข้าสู่ระบบ</button>
      <div class="msg" id="lmsg"></div>
    </form>
  </div>
</div>

<div id="dash">
  <div class="top">
    <div class="h">CJ<b>X</b> Inspect · <span style="font-weight:800">ภาพรวมงานก่อสร้าง</span></div>
    <div class="sp"></div>
    <button class="tbtn" id="autoBtn">⟳ อัปเดตอัตโนมัติ: ปิด</button>
    <button class="tbtn" id="refBtn">รีเฟรช</button>
    <button class="tbtn" id="outBtn">ออกจากระบบ</button>
    <div class="meta" id="meta" style="width:100%"></div>
  </div>
  <div id="body"><div class="spin">กำลังโหลดข้อมูล…</div></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const SUPABASE_URL='https://kmidlzhcdolxzpetecjx.supabase.co'
const SUPABASE_KEY='sb_publishable_4n3ZiIYvxYV335LLZe7Cnw_QHQeCJ3h'
const sb=createClient(SUPABASE_URL,SUPABASE_KEY)
const $=id=>document.getElementById(id)
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const CONSTRUCTION_DAYS=40
const DCOL={fail:'var(--fail)',done:'var(--pass)',progress:'var(--build)',idle:'var(--idle)'}
let _rows=[], _filter='all', _auto=null, _names={}

function cs(open){ if(!open) return {key:'unknown',days:null}
  const od=new Date(open+'T00:00:00'), now=new Date(); now.setHours(0,0,0,0)
  const days=Math.round((od-now)/86400000)
  const start=new Date(od); start.setDate(start.getDate()-CONSTRUCTION_DAYS)
  if(now>od) return {key:'opened',days}; if(now>=start) return {key:'building',days}; return {key:'notyet',days} }
function dstt(r){ if(r.fail>0) return 'fail'; if(r.total&&r.done>=r.total) return 'done'; if(r.done>0) return 'progress'; return 'idle' }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso),p=n=>String(n).padStart(2,'0')
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()+543} ${p(d.getHours())}:${p(d.getMinutes())}` }

async function boot(){ const {data:{session}}=await sb.auth.getSession(); if(session) enter(); else show('login') }
function show(w){ $('login').style.display=w==='login'?'flex':'none'; $('dash').style.display=w==='dash'?'block':'none' }
$('lform').onsubmit=async e=>{ e.preventDefault(); const m=$('lmsg'); m.className='msg'; m.textContent='กำลังเข้าสู่ระบบ…'
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value})
  if(error){ m.className='msg err'; m.textContent='เข้าไม่สำเร็จ: '+error.message; return } enter() }
$('outBtn').onclick=async()=>{ await sb.auth.signOut(); if(_auto)clearInterval(_auto); location.reload() }
$('refBtn').onclick=()=>load()
$('autoBtn').onclick=()=>{ if(_auto){ clearInterval(_auto); _auto=null; $('autoBtn').classList.remove('on'); $('autoBtn').textContent='⟳ อัปเดตอัตโนมัติ: ปิด' }
  else { _auto=setInterval(load,60000); $('autoBtn').classList.add('on'); $('autoBtn').textContent='⟳ อัปเดตอัตโนมัติ: เปิด (60วิ)'; load() } }
async function enter(){ show('dash'); await load() }

async function load(){
  const [{data:stores},{data:cps},{data:insps},{data:evs},{data:sgs},{data:profs}] = await Promise.all([
    sb.from('stores').select('code,name,province,opening_date,contractor'),
    sb.from('checkpoints').select('id,phase'),
    sb.from('inspections').select('id,store_code,phase'),
    sb.from('check_events').select('inspection_id,checkpoint,round,status,by,created_at'),
    sb.from('signoffs').select('store_code,kind'),
    sb.from('profiles').select('id,name,email')
  ])
  ;(profs||[]).forEach(p=>_names[p.id]=p.name||p.email||'—')
  const conIds=new Set((cps||[]).filter(c=>c.phase<200).map(c=>String(c.id)))   // ก่อสร้าง+Pre-Con (ไม่รวม Set-Up)
  const totalCP=conIds.size||1
  const cpPhase={}; (cps||[]).forEach(c=>cpPhase[String(c.id)]=c.phase)
  const inspById={}; (insps||[]).forEach(i=>inspById[i.id]=i)
  const agg={}
  ;(evs||[]).forEach(e=>{ const ins=inspById[e.inspection_id]; if(!ins||!conIds.has(e.checkpoint)) return
    const a=agg[ins.store_code]||(agg[ins.store_code]={cur:{},last:null})
    const k=e.checkpoint; if(!a.cur[k]||e.round>a.cur[k].round) a.cur[k]=e
    if(!a.last||(e.created_at&&e.created_at>a.last.at)) a.last={at:e.created_at,by:e.by} })
  const handover=new Set((sgs||[]).filter(x=>x.kind==='handover').map(x=>x.store_code))
  const scoped=(stores||[]).map(s=>({...s,cs:cs(s.opening_date)})).filter(s=>s.cs.key==='building'||agg[s.code])
  _rows=scoped.map(s=>{ const a=agg[s.code]||{cur:{},last:null}, vals=Object.values(a.cur)
    let phase=0; Object.keys(a.cur).forEach(k=>{ const p=cpPhase[k]; if(p&&p<200&&p>phase&&p<100) phase=p })
    return {code:s.code,name:s.name||s.code,prov:s.province||'',contractor:s.contractor||'',
      days:s.cs.days, done:vals.length, pass:vals.filter(e=>e.status==='pass').length, fail:vals.filter(e=>e.status==='fail').length,
      phase, total:totalCP, pct:Math.round(vals.length/totalCP*100), last:a.last, closed:handover.has(s.code)} })
  render()
  const d=new Date(),p=n=>String(n).padStart(2,'0')
  $('meta').textContent=`อัปเดตล่าสุด ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())} · ${_rows.length} สาขา`
}

function render(){
  const rows=_rows
  const near=rows.filter(r=>r.days!=null&&r.days<=7&&!r.closed).length
  const failStores=rows.filter(r=>r.fail>0).length, fails=rows.reduce((n,r)=>n+r.fail,0)
  const build=rows.filter(r=>r.cs?true:true).length // building/active scoped
  const done100=rows.filter(r=>r.done>=r.total&&r.fail===0).length
  const cnt={idle:0,progress:0,fail:0,done:0}; rows.forEach(r=>cnt[dstt(r)]++)
  const tot=rows.length||1
  const on=f=>_filter===f?' on':''
  const kpis=`<div class="kpis">
    <div class="kpi${on('all')}" data-f="all"><div class="v" style="color:var(--build)">${rows.length}</div><div class="k">สาขากำลังก่อสร้าง</div></div>
    <div class="kpi${on('fail')}" data-f="fail"><div class="v" style="color:var(--fail)">${failStores}</div><div class="k">สาขาต้องแก้${fails?' · '+fails+' จุด':''}</div></div>
    <div class="kpi${on('near')}" data-f="near"><div class="v" style="color:var(--build)">${near}</div><div class="k">ใกล้เปิด ≤7 วัน</div></div>
    <div class="kpi${on('done')}" data-f="done"><div class="v" style="color:var(--pass)">${done100}</div><div class="k">เสร็จ 100%</div></div>
  </div>`
  const bar=['done','progress','fail','idle'].map(k=>cnt[k]?`<i style="width:${cnt[k]/tot*100}%;background:${DCOL[k]}"></i>`:'').join('')
  const lg=[['done','เสร็จ'],['progress','กำลังตรวจ'],['fail','มีปัญหา'],['idle','ยังไม่เริ่ม']].map(([k,l])=>`<span><i style="background:${DCOL[k]}"></i>${l} ${cnt[k]}</span>`).join('')
  let list=[...rows]
  if(_filter==='fail') list=list.filter(r=>r.fail>0)
  else if(_filter==='near') list=list.filter(r=>r.days!=null&&r.days<=7&&!r.closed)
  else if(_filter==='done') list=list.filter(r=>r.done>=r.total&&r.fail===0)
  list.sort((a,b)=>(b.fail-a.fail)||((a.days==null?9999:a.days)-(b.days==null?9999:b.days)))
  const rowsHtml = list.length ? list.map(r=>{ const st=dstt(r); const c=DCOL[st]
    return `<tr>
      <td><span class="dot" style="background:${c}"></span><span class="stname">${esc(r.name)}</span><div class="stmeta"><span class="cd">${esc(r.code)}</span>${r.prov?' · '+esc(r.prov):''}</div></td>
      <td class="hidecol">${r.contractor?esc(r.contractor):'<span style="color:var(--faint)">—</span>'}</td>
      <td><span class="days" style="color:${r.days!=null&&r.days<=7?'var(--fail)':'var(--build)'}">${r.days!=null?r.days:'–'}</span> <span style="color:var(--faint);font-size:11px">วัน</span></td>
      <td class="hidecol">งวด ${r.phase||'-'}</td>
      <td><span class="bar"><i style="width:${r.pct}%;background:${c}"></i></span><span class="pct" style="color:${c}">${r.pct}%</span></td>
      <td class="num">${r.done}/${r.total}</td>
      <td class="num">${r.fail?`<span class="fail">${r.fail}</span>`:'<span style="color:var(--faint)">0</span>'}</td>
      <td class="hidecol" style="color:var(--mut);font-size:11.5px">${r.last?esc(_names[r.last.by]||'—')+'<br>'+fmtDate(r.last.at):'—'}</td>
    </tr>`}).join('') : '<tr><td colspan="8" class="empty">ไม่มีสาขาในกลุ่มนี้</td></tr>'
  $('body').innerHTML = kpis + `<div class="statusbar">${bar}</div><div class="lg">${lg}</div>`
    + `<div class="tablewrap"><div class="thead"><div class="tt">รายสาขา${_filter!=='all'?' · กรอง':''}</div>${_filter!=='all'?'<div class="flab" id="clr">✕ ล้างตัวกรอง</div>':''}</div>
       <div style="overflow-x:auto"><table><thead><tr><th>สาขา</th><th class="hidecol">ผรม.</th><th>เปิดใน</th><th class="hidecol">งวดล่าสุด</th><th>ความคืบหน้า</th><th class="num">ตรวจ</th><th class="num">ไม่ผ่าน</th><th class="hidecol">อัปเดตล่าสุด</th></tr></thead><tbody>${rowsHtml}</tbody></table></div></div>`
  $('body').querySelectorAll('.kpi').forEach(k=>k.onclick=()=>{ const f=k.dataset.f; _filter=(_filter===f?'all':f); render() })
  const clr=$('clr'); if(clr) clr.onclick=()=>{ _filter='all'; render() }
}
boot()
</script>
</body></html>
